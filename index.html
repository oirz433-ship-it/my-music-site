<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oirz Pro Studio | Beta</title>
    <style>
        :root {
            --primary: #8e44ad;
            --accent: #00d2ff;
            --discord: #5865F2;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            background: radial-gradient(circle at center, #1a1a2e, #000000);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* واجهة التنبيه (النسخة التجريبية) */
        #betaOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .beta-box {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.2);
        }

        .beta-box h2 { color: var(--accent); margin-bottom: 15px; }
        .beta-box p { font-size: 0.95rem; line-height: 1.6; color: #ccc; margin-bottom: 25px; }
        
        .enter-btn {
            background: var(--accent);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .enter-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent); }

        /* التصميم الأساسي للاستوديو */
        .brand-name {
            font-size: 5.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 12px;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--accent));
            animation: glowPulse 2s infinite alternate ease-in-out;
            margin-bottom: 5px;
        }

        @keyframes glowPulse {
            from { filter: drop-shadow(0 0 10px var(--accent)); transform: scale(1); }
            to { filter: drop-shadow(0 0 30px var(--primary)); transform: scale(1.03); }
        }

        .welcome-text { color: #888; font-size: 1rem; margin-bottom: 30px; letter-spacing: 1px; }

        .studio-card {
            background: var(--glass);
            backdrop-filter: blur(35px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 35px;
            width: 400px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9);
            text-align: center;
        }

        #songTitle {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border-right: 4px solid var(--accent);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .control-item {
            background: rgba(255,255,255,0.03);
            padding: 15px; border-radius: 18px; margin-bottom: 12px; text-align: right;
        }

        label { font-size: 0.75rem; color: #777; display: block; }
        .val-badge { float: left; color: var(--accent); font-weight: bold; }

        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; margin-top: 8px; }

        .btn-grid { display: flex; gap: 12px; margin-top: 25px; }
        button { flex: 1; padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }

        .play-btn { background: #fff; color: #000; }
        .save-btn { background: #2ecc71; color: white; }

        .discord-btn {
            display: flex; align-items: center; justify-content: center;
            background: var(--discord); color: white; text-decoration: none;
            padding: 15px; border-radius: 15px; margin-top: 15px; font-weight: bold; transition: 0.3s;
        }

        .rights-footer { margin-top: 25px; font-size: 0.7rem; opacity: 0.3; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- واجهة النسخة التجريبية -->
    <div id="betaOverlay">
        <div class="beta-box">
            <h2>تنبيه هام ⚠️</h2>
            <p>هذه نسخة تجريبية من الموقع (BETA).<br>سيتم تطويرها باستمرار وإضافة مميزات جديدة.<br>ترقبوا التحديثات الكبرى في سيرفر Discord.</p>
            <button class="enter-btn" onclick="closeOverlay()">دخول للاستوديو</button>
        </div>
    </div>

    <div class="brand-name">oirz</div>
    <div class="welcome-text">حياك الله، استمتع في تعديل أصوات الأغاني</div>

    <div class="studio-card">
        <div id="songTitle">ارفع ملف MP3 للبدء</div>

        <input type="range" id="seekBar" value="0" step="0.1" style="height: 4px;">
        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #555; margin-bottom: 20px;">
            <span id="curT">00:00</span>
            <span id="durT">00:00</span>
        </div>

        <div class="control-item">
            <label>مستوى الصوت <span class="val-badge" id="volV">100%</span></label>
            <input type="range" id="volRange" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="control-item">
            <label>صدى الكرت الفضي <span class="val-badge" id="revV">0%</span></label>
            <input type="range" id="revR" min="0" max="1" step="0.05" value="0">
        </div>

        <div class="control-item">
            <label>تضخيم الصوت <span class="val-badge" id="gainV">1.0x</span></label>
            <input type="range" id="gainR" min="1" max="4" step="0.1" value="1">
        </div>

        <div class="control-item">
            <label>سرعة التشغيل <span class="val-badge" id="speedV">1.0x</span></label>
            <input type="range" id="speedR" min="0.5" max="2.5" step="0.1" value="1">
        </div>

        <div class="btn-grid">
            <button class="play-btn" id="playBtn">تشغيل / إيقاف</button>
            <button class="save-btn" id="saveBtn">حفظ التعديل</button>
        </div>

        <a href="https://discord.gg/m-9" target="_blank" class="discord-btn">انضم لسيرفر Discord</a>

        <input type="file" id="fileIn" accept="audio/*" style="display:none">
        <button onclick="document.getElementById('fileIn').click()" style="background:none; border:none; color:#444; font-size:0.7rem; margin-top:20px; cursor:pointer;">تغيير الملف الصوتي</button>
    </div>

    <div class="rights-footer">جميع الحقوق محفوظة للمطور <b>oirz</b></div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
    function closeOverlay() {
        document.getElementById('betaOverlay').style.opacity = '0';
        setTimeout(() => { document.getElementById('betaOverlay').style.display = 'none'; }, 500);
    }

    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) return false;
    }

    const audio = document.getElementById('audio');
    let audioCtx, source, gainNode, reverbNode, wetGain, dryGain, destination, recorder, chunks = [];

    function setupEngine() {
        if (audioCtx) { audioCtx.close(); }
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(audio);
        gainNode = audioCtx.createGain();
        reverbNode = audioCtx.createConvolver();
        wetGain = audioCtx.createGain();
        dryGain = audioCtx.createGain();
        destination = audioCtx.createMediaStreamDestination();

        const rate = audioCtx.sampleRate;
        const impulse = audioCtx.createBuffer(2, rate * 2, rate);
        for(let i=0; i<2; i++){
            let ch = impulse.getChannelData(i);
            for(let j=0; j<rate*2; j++) ch[j] = (Math.random()*2-1) * Math.pow(1-j/(rate*2), 2);
        }
        reverbNode.buffer = impulse;

        source.connect(gainNode);
        gainNode.connect(dryGain);
        gainNode.connect(reverbNode);
        reverbNode.connect(wetGain);
        dryGain.connect(audioCtx.destination);
        wetGain.connect(audioCtx.destination);
        dryGain.connect(destination);
        wetGain.connect(destination);
        
        wetGain.gain.value = document.getElementById('revR').value;
        gainNode.gain.value = document.getElementById('gainR').value;
        audio.playbackRate = document.getElementById('speedR').value;
        audio.volume = document.getElementById('volRange').value;
    }

    // الإصلاح النهائي لمشكلة الرفع
    document.getElementById('fileIn').onchange = (e) => {
        const file = e.target.files[0]; // تأكدنا من اختيار ملف واحد بدقة
        if (file) {
            document.getElementById('songTitle').innerText = file.name;
            audio.src = URL.createObjectURL(file);
            setupEngine();
        }
        // تصفير القيمة للسماح برفع نفس الملف مرة أخرى إذا لزم الأمر
        e.target.value = ""; 
    };

    document.getElementById('playBtn').onclick = () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.paused ? audio.play() : audio.pause();
    };

    document.getElementById('volRange').oninput = (e) => {
        audio.volume = e.target.value;
        document.getElementById('volV').innerText = Math.round(e.target.value * 100) + '%';
    };

    document.getElementById('revR').oninput = (e) => {
        if (wetGain) wetGain.gain.value = e.target.value;
        document.getElementById('revV').innerText = Math.round(e.target.value * 100) + '%';
    };

    document.getElementById('gainR').oninput = (e) => {
        if (gainNode) gainNode.gain.value = e.target.value;
        document.getElementById('gainV').innerText = e.target.value + 'x';
    };

    document.getElementById('speedR').oninput = (e) => {
        audio.playbackRate = e.target.value;
        document.getElementById('speedV').innerText = e.target.value + 'x';
    };

    audio.ontimeupdate = () => {
        if (!isNaN(audio.duration)) {
            document.getElementById('seekBar').value = (audio.currentTime / audio.duration) * 100;
            document.getElementById('curT').innerText = formatTime(audio.currentTime);
            document.getElementById('durT').innerText = formatTime(audio.duration);
        }
    };

    document.getElementById('seekBar').oninput = (e) => {
        audio.currentTime = (e.target.value / 100) * audio.duration;
    };

    function formatTime(s) {
        let m = Math.floor(s/60), r = Math.floor(s%60);
        return (m<10?'0':'')+m+":"+(r<10?'0':'')+r;
    }

    document.getElementById('saveBtn').onclick = () => {
        if (!destination) return alert("ارفع ملف أولاً");
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            document.getElementById('saveBtn').innerText = "حفظ التعديل";
            return;
        }
        chunks = [];
        recorder = new MediaRecorder(destination.stream);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/mp3' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `oirz_studio_export.mp3`;
            a.click();
        };
        recorder.start();
        document.getElementById('saveBtn').innerText = "إيقاف وحفظ الآن";
    };
</script>
</body>
</html>
